constraintlayout = "2.2.2"
fragmentKtx = "1.8.5"
lifecycleKtx = "2.9.0"
recyclerview = "1.4.0"
viewpager2 = "1.1.0"
supabaseBom = "3.8.0"
ktor = "3.0.0"
coroutines = "1.8.1"
serializationJson = "1.7.3"
osmdroid = "6.1.20"
